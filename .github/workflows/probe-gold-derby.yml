name: Diagnose Gold Derby contender expansion

on:
  pull_request:
    paths:
      - '.github/workflows/probe-gold-derby.yml'
      - 'scraper/**'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install playwright
          playwright install --with-deps chromium
      - name: Test category expansion settling time
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page()
              page.goto('https://www.goldderby.com/odds/combined-odds/oscars-nominations-2027/', wait_until='domcontentloaded')
              page.wait_for_selector('[data-component="predictions-contestant-item"]',timeout=60000)
              page.wait_for_timeout(2000)
              awards = page.locator('[data-component="predictions-award-item"]')
              print('AWARDS',awards.count(),flush=True)
              for idx in [0,1,3,7,10]:
                  award=awards.nth(idx)
                  cat=award.locator('h1,h2,h3,h4,h5,h6').first.inner_text()
                  entries=award.locator('[data-component="predictions-contestant-item"]')
                  before=entries.count()
                  btn=award.locator('[data-alias="expand__show-button"] button').last
                  print('CLICKING',cat,before,'visible',btn.is_visible(),flush=True)
                  try:
                      btn.click(timeout=8000)
                  except Exception as ex:
                      print('CLICK ERROR',cat,str(ex)[:220],flush=True)
                  for t in range(1,11):
                      page.wait_for_timeout(1000)
                      n=entries.count()
                      print('WAIT',cat,t,n,'body characters',len(award.inner_text()),flush=True)
                      if n>before:
                          break
              browser.close()
          PY
