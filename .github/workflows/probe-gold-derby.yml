name: Test Gold Derby full-category scraping

on:
  pull_request:
    paths:
      - '.github/workflows/probe-gold-derby.yml'
      - 'scraper/**'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium
      - name: Verify all sources expand categories before parsing
        run: |
          python - <<'PY'
          from scraper.scrape import scrape_all
          data = scrape_all()
          for source, categories in data['sources'].items():
              lengths = {name: len(entries) for name, entries in categories.items()}
              print(source, 'categories=',len(lengths), 'contenders=',sum(lengths.values()),flush=True)
              print(source, 'small categories=',{name:n for name,n in lengths.items() if n<=5},flush=True)
              assert len(lengths)>=20,(source,lengths)
              assert sum(n==5 for n in lengths.values()) <= 2,(source,lengths)
          PY
